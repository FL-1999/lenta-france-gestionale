name: Gestionale regression tests
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q --disable-warnings
        env:
          RUN_BROWSER_TESTS: '1'
  postgres-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: lenta_operations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_operations.py tests/test_workspace_repairs.py tests/test_logistics_workflows.py tests/test_purchasing_workflows.py tests/test_warehouse_a1.py tests/test_order_line_classification.py tests/test_supplier_workspace.py tests/test_article_suppliers.py tests/test_order_workspace.py tests/test_purchasing_navigation.py tests/test_warehouse_packaging.py tests/test_site_plans.py tests/test_plan_coupe_fiche_flow.py --disable-warnings --tb=short
        env:
          TEST_POSTGRES_URL: postgresql://postgres:local-ci-only@localhost:5432/lenta_operations_test
