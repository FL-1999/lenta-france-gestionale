<article class="order-line" data-order-line>
  <div class="order-line-heading"><strong>{{ t('Articolo','Article') }} <span data-row-number></span></strong><button type="button" class="btn btn-secondary btn-sm remove-row" aria-label="{{ t('Rimuovi riga','Supprimer la ligne') }}">{{ t('Rimuovi','Supprimer') }}</button></div>
  <div class="order-line-fields">
    <label class="form-field order-line-wide">{{ t('Articolo','Article') }}<select name="magazzino_item_id" required><option value="">{{ t('Seleziona o crea un articolo','Sélectionner ou créer un article') }}</option><option value="__new__" {% if line.magazzino_item_id == '__new__' %}selected{% endif %}>+ {{ t('Crea nuovo articolo','Créer un nouvel article') }}</option>{% for item in magazzino_items %}<option value="{{ item.id }}" {% if line.magazzino_item_id == item.id|string %}selected{% endif %} data-name="{{ item.nome }}" data-unit="{{ item.unita_misura }}" data-classification="{% if item.categoria %}{{ item.categoria.macro.name ~ ' / ' if item.categoria.macro else '' }}{{ item.categoria.nome }}{% else %}{{ t('Da classificare','À classer') }}{% endif %}">{{ item.codice }} · {{ item.nome }} ({{ item.unita_misura }})</option>{% endfor %}</select><span class="text-muted" data-existing-classification></span></label>
    <label class="form-field">{{ t('Codice fornitore','Code fournisseur') }}<input name="codice" list="supplier-codes-list" maxlength="100" value="{{ line.codice or '' }}" data-codice></label>
    <label class="form-field order-line-wide">{{ t('Descrizione articolo','Description de l’article') }}<input name="description" value="{{ line.description or '' }}" required data-desc></label>
    <label class="form-field">{{ t('Quantità','Quantité') }} <span data-row-unit></span><input name="qty_ordered" type="number" min="0.01" step="0.01" value="{{ line.qty_ordered or '' }}" required></label>
  </div>
  <div class="order-line-classification" data-new-classification hidden>
    <div class="order-line-fields">
      <label class="form-field order-line-wide">{{ t('Classificazione di questo articolo','Classification de cet article') }}<select name="line_category_mode">{% for value,it,fr in [('existing','Categoria esistente','Catégorie existante'),('new_in_macro','Nuova categoria in macro esistente','Nouvelle catégorie dans une macro existante'),('new_macro','Nuova macro e nuova categoria','Nouvelle macro et nouvelle catégorie')] %}<option value="{{ value }}" {% if line.line_category_mode == value %}selected{% endif %}>{{ t(it,fr) }}</option>{% endfor %}</select></label>
      <label class="form-field">{{ t('Unità','Unité') }}<select name="line_unit">{% for value in ['pz','kg','m','m2','m3','l'] %}<option value="{{ value }}" {% if line.line_unit == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label>
    </div>
    <div data-category-panel="existing" class="form-field"><label>{{ t('Macro / categoria','Macro / catégorie') }}<select name="line_category_id"><option value="">{{ t('Seleziona categoria','Sélectionner une catégorie') }}</option>{% for group in grouped_warehouse_categories %}<optgroup label="{{ group.macro_name }}">{% for category in group.categories %}<option value="{{ category.id }}" {% if line.line_category_id == category.id|string %}selected{% endif %}>{{ category.nome }}</option>{% endfor %}</optgroup>{% endfor %}</select></label></div>
    <div data-category-panel="new_in_macro" class="form-field" hidden><label>{{ t('Macro esistente','Macro existante') }}<select name="line_macro_id"><option value="">{{ t('Seleziona macro','Sélectionner une macro') }}</option>{% for macro in macros %}<option value="{{ macro.id }}" {% if line.line_macro_id == macro.id|string %}selected{% endif %}>{{ macro.name }}</option>{% endfor %}</select></label></div>
    <div data-category-panel="new_macro" class="form-field" hidden><label>{{ t('Nome nuova macro','Nom de la nouvelle macro') }}<input name="line_new_macro" maxlength="120" value="{{ line.line_new_macro or '' }}"></label></div>
    <div data-category-panel="new_in_macro new_macro" class="form-field" hidden><label>{{ t('Nome nuova categoria','Nom de la nouvelle catégorie') }}<input name="line_new_category" maxlength="255" value="{{ line.line_new_category or '' }}"></label></div>
  </div>
</article>
