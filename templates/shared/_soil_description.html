<div class="soil-description">
  <label>
    <span>{{ 'Description (facultative)' if lang == 'fr' else 'Descrizione (facoltativa)' }}</span>
    <select name="strato_descrizione" class="form-select" data-soil-description>
      <option value="">{{ 'Aucune description' if lang == 'fr' else 'Nessuna descrizione' }}</option>
      {% for value, it, fr in [('molto_fine', 'Molto fine', 'Très fin'), ('fine', 'Fine', 'Fin'), ('grossolano', 'Grossolano', 'Grossier'), ('0_50', '0 - 50 mm', '0 - 50 mm'), ('50_100', '50 - 100 mm', '50 - 100 mm'), ('oltre_100', '>100 mm', '>100 mm'), ('assenti', 'Senza frazione fine', 'Sans fines'), ('altro', 'Altro…', 'Autre…')] %}
      <option value="{{ value }}" {% if strato.descrizione == value %}selected{% endif %}>{{ fr if lang == 'fr' else it }}</option>
      {% endfor %}
    </select>
  </label>
  <label class="soil-description-other" {% if strato.descrizione != 'altro' %}hidden{% endif %}>
    <span>{{ 'Précisez la description' if lang == 'fr' else 'Scrivi la descrizione' }}</span>
    <input name="strato_descrizione_altro" class="form-control" type="text" maxlength="100"
           value="{{ strato.descrizione_altro|default('') }}"
           placeholder="{{ 'Décrivez le terrain…' if lang == 'fr' else 'Descrivi il terreno…' }}"
           {% if strato.descrizione == 'altro' %}required{% endif %}>
  </label>
</div>
